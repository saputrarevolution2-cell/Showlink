<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Pastelink — ShowLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="/css/showlink-components.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/footer.css"><link rel="stylesheet" href="/css/pastelink.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase-config.js"></script><script src="/js/supabase-client.js"></script><script src="/js/navbar.js" defer></script><script src="/js/footer.js" defer></script><script src="/js/pastelink.js" defer></script></head><body class="app-page coming-page"><div data-showlink-navbar></div><main class="paste-shell"><section class="paste-card"><div class="paste-heading"><span class="paste-kicker"><i class="fa-solid fa-paste"></i> SHOWLINK PASTELINK</span><h1>Buat <span>PasteLink</span></h1><p>Tulis teks, format sesukamu, lalu bagikan lewat tautan pendek.</p></div><label for="paste-title">Judul (opsional)</label><input id="paste-title" maxlength="120" placeholder="Contoh: Catatan penting"><label>Isi PasteLink</label><div class="paste-toolbar" role="toolbar" aria-label="Format teks"><button type="button" data-format="bold" title="Tebal"><i class="fa-solid fa-bold"></i></button><button type="button" data-format="italic" title="Miring"><i class="fa-solid fa-italic"></i></button><button type="button" id="copy-selected" title="Salin teks yang dipilih"><i class="fa-regular fa-copy"></i> Salin pilihan</button></div><textarea id="paste-content" rows="10" maxlength="20000" placeholder="Tulis atau tempel teks di sini… URL https:// dan www akan otomatis bisa diklik saat dibuka."></textarea><div class="paste-hint">Tips: pilih teks lalu tekan tombol tebal atau miring. Di halaman hasil, tekan teks untuk menyalinnya.</div><button id="create-paste" class="paste-submit"><i class="fa-solid fa-link"></i> Buat PasteLink</button><p id="paste-message" class="paste-message" role="status"></p><div id="paste-result" class="paste-result" hidden></div></section></main><div data-showlink-footer></div></body></html>
