<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6d5dfc">
  <meta name="description" content="Buat PasteLink di ShowLink untuk menjual dan membagikan konten digital.">
  <title>Buat PasteLink — ShowLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/css/pastelink-create.css">
  <script src="/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/showlink-components.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/footer.js" defer></script>
  <script>
    (function(){try{var t=localStorage.getItem('showlink-theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}}catch(e){}})();
  </script>
  <link rel="stylesheet" href="/css/showlink-components.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="icon" type="image/svg+xml" href="/assets/showlink-favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/showlink-favicon.png">
  <link rel="apple-touch-icon" href="/assets/showlink-favicon.png">
</head>
<body class="dashboard-page" data-page-title-id="Buat PasteLink — ShowLink" data-page-title-en="Create PasteLink — ShowLink">
  <div data-showlink-navbar></div>
  <main class="pl-create-main">
    <div class="pl-create-container">
      <section class="pl-create-hero">
        <div>
          <span class="pl-kicker"><i class="fa-solid fa-link"></i> SHOWLINK</span>
          <h1>Buat PasteLink</h1>
          <p>Ubah link, source berkas, atau konten digital kamu menjadi satu link ShowLink yang siap dibagikan.</p>
        </div>
        <a class="pl-back" href="/index.html"><i class="fa-solid fa-arrow-left"></i> Beranda</a>
      </section>

      <section class="pl-card">
        <form id="pastelink-form" novalidate>
          <label class="pl-field">
            <span>Judul <b>*</b></span>
            <input name="title" maxlength="160" placeholder="Contoh: Source Website Premium" autocomplete="off" required>
            <small class="pl-warning" data-warning="title">Judul wajib diisi.</small>
          </label>
          <label class="pl-field">
            <span>Deskripsi</span>
            <textarea name="description" rows="3" maxlength="2000" placeholder="Jelaskan singkat isi konten atau berkas kamu..."></textarea>
          </label>
          <label class="pl-field">
            <span>Isi / Source / Link <b>*</b></span>
            <textarea name="content" rows="12" maxlength="100000" placeholder="Tempel link, source code, teks, atau informasi yang ingin kamu jual..."></textarea>
            <small class="pl-help">URL seperti https:// atau www. otomatis dibuat menjadi link yang bisa diklik.</small>
            <small class="pl-warning" data-warning="content">Isi konten wajib diisi.</small>
          </label>
          <div class="pl-options">
            <label class="pl-field">
              <span>Tag <small>(opsional)</small></span>
              <input name="tags" maxlength="300" placeholder="source, website, premium">
            </label>
            <label class="pl-field">
              <span>Visibilitas</span>
              <select name="visibility">
                <option value="public">Public — bisa ditemukan melalui link</option>
                <option value="private">Private — hanya akses langsung</option>
              </select>
            </label>
          </div>
          <div class="pl-note"><i class="fa-solid fa-shield-halved"></i><span>Pastikan kamu memiliki hak untuk membagikan atau menjual konten yang kamu upload.</span></div>
          <button class="pl-submit" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Buat PasteLink</span></button>
          <div id="pastelink-result" class="pl-result" role="status" aria-live="polite" hidden></div>
        </form>
      </section>
    </div>
  </main>
  <div data-showlink-footer></div>
  <script src="/js/pastelink-create.js" defer></script>
</body>
</html>
