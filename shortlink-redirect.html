<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mengarahkan… — ShowLink</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fc;color:#172033;font:16px Inter,system-ui,sans-serif}.box{text-align:center;background:#fff;padding:36px;border-radius:22px;box-shadow:0 16px 48px #17203312;max-width:420px;margin:20px}.spin{width:32px;height:32px;border:3px solid #dbeafe;border-top-color:#4f46e5;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}@keyframes s{to{transform:rotate(360deg)}}a{color:#4f46e5;overflow-wrap:anywhere}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase-config.js"></script></head><body><main class="box"><div class="spin"></div><h1 id="title">Mengarahkan…</h1><p id="message">Mohon tunggu sebentar.</p><a id="manual" hidden rel="noopener noreferrer">Buka tautan tujuan</a></main><script>
(async()=>{const t=document.getElementById('title'),m=document.getElementById('message'),a=document.getElementById('manual');try{const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();const cfg=window.SHOWLINK_SUPABASE||{};if(!window.supabase||!cfg.url||!cfg.anonKey)throw Error('Konfigurasi layanan belum tersedia.');const sb=window.supabase.createClient(cfg.url,cfg.anonKey);const {data,error}=await sb.rpc('resolve_shortlink',{p_slug:slug});if(error)throw error;const url=data?.destination_url||data?.[0]?.destination_url;if(!url)throw Error('Shortlink tidak ditemukan atau sudah dihapus.');const dest=new URL(url);if(!['http:','https:'].includes(dest.protocol))throw Error('URL tujuan tidak aman.');t.textContent='Tautan ditemukan!';m.textContent='Kamu akan segera diarahkan.';a.href=dest.href;a.textContent=dest.href;a.hidden=false;location.replace(dest.href)}catch(e){t.textContent='Shortlink tidak tersedia';m.textContent=e.message||'Tautan ini tidak ditemukan.'}})();</script></body></html>
