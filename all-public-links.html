<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>All Public Links — ShowLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="/css/showlink-components.css?v=20261016-theme2">
<link rel="stylesheet" href="/css/navbar.css?v=20261017-nav37">
<link rel="stylesheet" href="/css/footer.css">
<link rel="stylesheet" href="/css/all-public-links.css?v=20261016-directory3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script><script src="/js/supabase-client.js"></script>
<script src="/js/language.js?v=20261009-nav35" defer></script>
<script src="/js/navbar.js?v=20261019-endorse1" defer></script>
<script src="/js/footer.js" defer></script>

<body class="app-page public-directory-page" data-page-title-id="Semua tautan publik — ShowLink" data-page-title-en="All Public Links — ShowLink">
<div data-showlink-navbar></div>
<main class="public-directory-shell">
  <header class="public-directory-header">
    <div class="directory-kicker"><i class="fa-solid fa-globe"></i><span data-i18n="kicker">SHOWLINK · DIREKTORI TAUTAN</span></div>
    <h1 data-i18n="title">Semua tautan publik</h1>
    <p data-i18n="description">Temukan Shortlink, PasteLink, dan Payment Link yang dibagikan secara publik.</p>
    <div class="directory-total-row"><div id="public-links-status" role="status">Memuat tautan publik…</div><div class="directory-total-views"><i class="fa-solid fa-eye"></i><span data-i18n="totalViews">Total view</span><strong id="public-links-total-views">0</strong></div></div>
  </header>
  <nav class="public-link-filters" aria-label="Filter tautan" id="public-link-filters">
    <button type="button" class="directory-filter is-active" data-filter="all"><i class="fa-solid fa-layer-group"></i><span data-i18n="allLinks">All Link</span></button>
    <button type="button" class="directory-filter" data-filter="shortlink"><i class="fa-solid fa-link"></i><span>Shortlink</span></button>
    <button type="button" class="directory-filter" data-filter="pastelink"><i class="fa-solid fa-file-lines"></i><span>PasteLink</span></button>
    <button type="button" class="directory-filter" data-filter="paymentlink"><i class="fa-solid fa-credit-card"></i><span>PaymentLink</span></button>
    <button type="button" class="directory-filter" data-filter="top10"><i class="fa-solid fa-trophy"></i><span data-i18n="top10">Top 10 Link</span></button>
    <button type="button" class="directory-filter" data-filter="new"><i class="fa-solid fa-clock"></i><span data-i18n="newLinks">New Link</span></button>
  </nav>
  <section class="public-directory-panel" aria-live="polite">
    <div class="directory-list-heading"><h2 id="directory-section-title">All Link</h2><span id="directory-page-summary"></span></div>
    <div id="directory-stats" class="directory-stats" aria-live="polite"></div>
    <div id="public-links-list" class="public-links-list"></div>
    <div id="public-links-pagination" class="public-links-pagination" aria-label="Pagination"></div>
  </section>
  <a class="directory-back" href="/dashboard.html"><i class="fa-solid fa-arrow-left"></i><span data-i18n="back">Kembali ke Dashboard</span></a>
</main>
<div data-showlink-footer></div>
</body></html>
